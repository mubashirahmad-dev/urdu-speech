<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urdu Voice to Text</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f7f6; --card:#fff; --ink:#14201b; --muted:#5d6b64; --accent:#0b6b4f; --rec:#c62828; --line:#d9e1dd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1512; --card:#18211c; --ink:#e8f0ec; --muted:#93a39b; --accent:#3fbf94; --rec:#ef5350; --line:#2a3731; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter,system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:16px; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:1.25rem; margin:8px 0 4px; }
  p.sub { margin:0 0 16px; color:var(--muted); font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; }
  #mic { width:100%; padding:16px; font-size:1.05rem; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; }
  #mic.on { background:var(--rec); }
  #status { margin:10px 0; font-size:.85rem; color:var(--muted); min-height:1.2em; }
  textarea { width:100%; height:240px; margin-top:6px; padding:12px; border:1px solid var(--line); border-radius:10px;
    background:transparent; color:var(--ink); direction:rtl; text-align:right;
    font-family:'Noto Nastaliq Urdu',serif; font-size:20px; line-height:2.2; resize:vertical; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .row button, .row label { flex:1 1 auto; padding:11px 12px; font-size:.9rem; border:1px solid var(--line);
    background:transparent; color:var(--ink); border-radius:8px; text-align:center; }
  .row label { display:flex; align-items:center; justify-content:center; gap:6px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chips button { padding:6px 10px; border:1px solid var(--line); background:transparent; color:var(--ink);
    border-radius:16px; font-family:'Noto Nastaliq Urdu',serif; font-size:15px; }
  .chips button.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
  .fix { margin-top:10px; font-size:.9rem; }
  .fix input { flex:1 1 40%; padding:10px; border:1px solid var(--line); border-radius:8px; background:transparent;
    color:var(--ink); font-family:'Noto Nastaliq Urdu',serif; font-size:16px; }
  button:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Urdu voice to text</h1>
  <p class="sub">Tap the mic and speak Urdu. Copy the text into InPage.</p>

  <div class="card">
    <button id="mic">🎤 Start speaking</button>
    <div id="status">Ready</div>

    <div id="alts" class="chips"></div>
    <textarea id="out" placeholder="یہاں اردو متن ظاہر ہوگا" dir="rtl"></textarea>

    <div class="row">
      <button id="dot">۔ Full stop</button>
      <button id="q">؟ Question</button>
      <button id="comma">، Comma</button>
      <button id="nl">↵ New line</button>
    </div>
    <div class="row">
      <label><input type="checkbox" id="dd" checked> Remove repeats</label>
      <label><input type="checkbox" id="spl"> One sentence per line</label>
    </div>
    <details class="fix">
      <summary>Wrong word? Save a correction</summary>
      <div class="row">
        <input id="fixfrom" dir="rtl" placeholder="غلط لفظ">
        <input id="fixto" dir="rtl" placeholder="درست لفظ">
        <button id="addfix">Save</button>
      </div>
      <div id="fixlist" class="chips"></div>
    </details>
    <div class="row">
      <button id="copy">Copy</button>
      <button id="dl">Download .txt</button>
      <button id="clear">Clear</button>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const out = $("out"), mic = $("mic"), status = $("status");

// ---------- cleanup ----------
function cleanUrdu(t) {
  return t.normalize("NFC")
    .replace(/[يى]/g, "ی").replace(/ك/g, "ک").replace(/ە/g, "ہ")
    .replace(/\?/g, "؟").replace(/,/g, "،").replace(/\.(\s|$)/g, "۔$1")
    .replace(/[\u200B-\u200D\uFEFF]/g, "").replace(/[ \t]+/g, " ");
}
function sentencePerLine(t) {
  return t.replace(/([۔؟])[ \t]*(?!\n)/g, "$1\n").replace(/\n{2,}/g, "\n").trim();
}

// ---------- fix 1: remove repeated words / phrases ----------
function dedupe(text) {
  return text.split("\n").map(line => {
    let w = line.split(/\s+/).filter(Boolean);
    for (let n = 5; n >= 1; n--) {
      let i = 0;
      while (i + 2 * n <= w.length) {
        let same = true;
        for (let k = 0; k < n; k++) if (w[i + k] !== w[i + n + k]) { same = false; break; }
        if (same) w.splice(i + n, n); else i++;
      }
    }
    return w.join(" ");
  }).join("\n");
}

// ---------- fix 2: saved corrections (wrong -> right) ----------
let fixes = [];
try { fixes = JSON.parse(localStorage.getItem("urduFixes") || "[]"); } catch (_) {}
function saveFixes() { try { localStorage.setItem("urduFixes", JSON.stringify(fixes)); } catch (_) {} drawFixes(); render(); }
function applyFixes(t) {
  fixes.forEach(f => { t = t.split(f.from).join(f.to); });
  return t;
}
function drawFixes() {
  const box = $("fixlist"); box.innerHTML = "";
  fixes.forEach((f, i) => {
    const b = document.createElement("button");
    b.textContent = f.from + " ← " + f.to + "  ✕";
    b.dir = "rtl";
    b.onclick = () => { fixes.splice(i, 1); saveFixes(); };
    box.appendChild(b);
  });
}
$("addfix").onclick = () => {
  const a = $("fixfrom").value.trim(), b = $("fixto").value.trim();
  if (!a || !b) return;
  fixes.push({ from: a, to: b });
  $("fixfrom").value = ""; $("fixto").value = "";
  saveFixes();
};

// ---------- state ----------
// committed: text from finished sessions / manual edits
// segs: final phrases of the current session, each {alts, pick}
let committed = "", segs = [], interimText = "", skip = 0, lastLen = 0;

function render() {
  let t = committed + segs.map(s => s.alts[s.pick]).join(" ") + " " + interimText;
  if ($("dd").checked) t = dedupe(t);
  t = applyFixes(t);
  t = cleanUrdu(t);
  if ($("spl").checked) t = sentencePerLine(t);
  out.value = t;
  drawAlts();
}
function commitSession() {
  committed += segs.map(s => s.alts[s.pick]).join(" ") + " ";
  segs = []; interimText = "";
}

// alternatives for the last phrase (tap if the word is wrong)
function drawAlts() {
  const box = $("alts"); box.innerHTML = "";
  const s = segs[segs.length - 1];
  if (!s || s.alts.length < 2) return;
  s.alts.forEach((a, i) => {
    const b = document.createElement("button");
    b.textContent = a; b.dir = "rtl";
    if (i === s.pick) b.className = "sel";
    b.onclick = () => { s.pick = i; render(); };
    box.appendChild(b);
  });
}

// ---------- speech ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec, listening = false;

if (!SR) {
  status.textContent = "Speech recognition not supported. Use Chrome or Edge.";
  mic.disabled = true;
} else {
  rec = new SR();
  rec.lang = "ur-PK";
  rec.continuous = true;
  rec.interimResults = true;
  rec.maxAlternatives = 3;

  rec.onresult = e => {
    // rebuild from ALL results every time (avoids Android duplicate-append bug)
    lastLen = e.results.length;
    segs = []; interimText = "";
    for (let i = skip; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) {
        const alts = [];
        for (let j = 0; j < r.length; j++) alts.push(r[j].transcript.trim());
        segs.push({ alts, pick: 0 });
      } else interimText += r[0].transcript;
    }
    render();
  };
  rec.onstart = () => { skip = 0; status.textContent = "Listening… speak in Urdu"; };
  rec.onend = () => {
    commitSession();
    if (listening) { try { rec.start(); } catch (_) {} }
    else { status.textContent = "Stopped"; render(); }
  };
  rec.onerror = e => {
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      listening = false; setUI();
      status.textContent = "Microphone blocked. Allow mic access and use HTTPS.";
    } else if (e.error === "no-speech") status.textContent = "No speech heard, still listening…";
    else if (e.error === "network") status.textContent = "Network error. Needs internet.";
    else status.textContent = "Error: " + e.error;
  };
}
function setUI() {
  mic.classList.toggle("on", listening);
  mic.textContent = listening ? "⏹ Stop" : "🎤 Start speaking";
}
mic.onclick = () => {
  listening = !listening; setUI();
  if (listening) { try { rec.start(); } catch (_) {} } else rec.stop();
};

// ---------- buttons ----------
function add(s) { commitSession(); committed = committed.trimEnd() + s; skip = lastLen; render(); }
$("dot").onclick = () => add("۔ ");
$("q").onclick = () => add("؟ ");
$("comma").onclick = () => add("، ");
$("nl").onclick = () => add("\n");
$("spl").onchange = render;
$("dd").onchange = render;

// manual edits become the new base text
out.addEventListener("input", () => { committed = out.value + " "; segs = []; interimText = ""; skip = lastLen; $("alts").innerHTML = ""; });

$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(out.value); status.textContent = "Copied. Paste into InPage."; }
  catch (_) { out.select(); document.execCommand("copy"); status.textContent = "Copied."; }
};
$("dl").onclick = () => {
  const blob = new Blob(["\uFEFF" + out.value], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "urdu-text.txt"; a.click();
};
$("clear").onclick = () => { committed = ""; segs = []; interimText = ""; skip = lastLen; out.value = ""; $("alts").innerHTML = ""; };

drawFixes();
</script>
</body>
</html>
